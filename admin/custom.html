<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ניהול האתר | Rosman</title><style>*{box-sizing:border-box}body{background:#edf4f5;color:#213942;font-family:Arial,sans-serif;margin:0}main{max-width:630px;margin:30px auto;padding:18px}header{text-align:center;margin-bottom:25px}h1{font-size:25px}h2{font-size:18px}section{background:white;border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 4px 16px #143c4211}label{font-size:14px;font-weight:600;display:block;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #cad8dc;border-radius:9px;padding:11px;font:inherit;direction:rtl}textarea{min-height:115px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;padding:14px;border:0;background:#147b66;color:#fff;border-radius:10px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#657a80;font-size:13px}.error{color:#a22}.success{color:#175}#editor{display:none}.toolbar{display:flex;gap:8px}.toolbar button{width:auto}#notice{min-height:22px}details{border-top:1px solid #ddd;padding-top:12px}summary{cursor:pointer;font-weight:bold}</style></head><body><main><header><h1>Rosman Swimming School</h1><p class="muted">ניהול האתר • פרטים ומחירים</p></header><section id="login"><h2>כניסה לניהול</h2><form id="loginForm"><label>שם משתמש<input id="username" autocomplete="username" required></label><label>סיסמה<input id="password" type="password" autocomplete="current-password" required></label><button>כניסה</button></form></section><div id="editor"><section><div class="toolbar"><button id="logout" type="button">התנתקות</button></div><p class="muted">השינויים יפורסמו אוטומטית לאחר השמירה.</p></section><form id="editForm"><section><h2>פרטים ומחירים</h2><div class="pair"><label>שיעור פרטי (₪)<input name="privatePrice" type="number" min="0" required></label><label>שיעור זוגי (₪)<input name="pairPrice" type="number" min="0" required></label></div><label>מיקום<input name="location"></label><label>שעות אמצע השבוע<input name="weekdayHours"></label><label>שעות שישי<input name="fridayHours"></label></section><section><h2>שיעורי שחייה</h2><label>הטקסט המרכזי בכרטיסיית שיעורי השחייה<textarea name="lessonIntroduction"></textarea></label></section><section><h2>ביטוחים והידרותרפיה</h2><label>הטקסט המרכזי בכרטיסיית הביטוח<textarea name="insuranceIntro"></textarea></label></section><section><details><summary>פרטי קשר</summary><label>טלפון וואטסאפ (972... בלי +)<input name="whatsappPhone"></label><label>הודעה מוכנה<textarea name="whatsappMessage"></textarea></label><label>מייל<input name="contactEmail" type="email"></label></details></section><button id="save">שמירה ופרסום</button></form></div><p id="notice" role="status"></p></main><script>
const api='/\.netlify/functions/admin-api';let sha;const q=s=>document.querySelector(s),notice=t=>q('#notice').textContent=t;
async function call(action,data){const r=await fetch(api+'?action='+action,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},credentials:'same-origin',body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'שגיאה');return j}
async function load(){const j=await call('read');sha=j.sha;for(const [k,v] of Object.entries(j.data)){const el=q('[name="'+k+'"]');if(el)el.value=v}q('#login').style.display='none';q('#editor').style.display='block'}
q('#loginForm').onsubmit=async e=>{e.preventDefault();try{await call('login',{username:q('#username').value,password:q('#password').value});q('#password').value='';await load();notice('מחובר בהצלחה')}catch(err){notice(err.message)}};
q('#editForm').onsubmit=async e=>{e.preventDefault();const data={};for(const el of q('#editForm').elements)if(el.name)data[el.name]=el.type==='number'?Number(el.value):el.value;try{q('#save').disabled=true;const j=await call('save',{data,sha});sha=j.sha;notice('נשמר בהצלחה ב-GitHub. הפרסום באתר עשוי לקחת זמן קצר.')}catch(err){notice(err.message)}finally{q('#save').disabled=false}};
q('#logout').onclick=async()=>{await call('logout',{});location.reload()};
call('session').then(j=>j.authenticated?load():null).catch(()=>{});
</script></body></html>
