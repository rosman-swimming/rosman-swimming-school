<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ניהול האתר | Rosman</title><style>*{box-sizing:border-box}body{background:#edf4f5;color:#213942;font-family:Arial,sans-serif;margin:0}main{max-width:630px;margin:30px auto;padding:18px}header{text-align:center;margin-bottom:25px}h1{font-size:25px}h2{font-size:18px}section{background:white;border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 4px 16px #143c4211}label{font-size:14px;font-weight:600;display:block;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #cad8dc;border-radius:9px;padding:11px;font:inherit;direction:rtl}textarea{min-height:115px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;padding:14px;border:0;background:#147b66;color:#fff;border-radius:10px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#657a80;font-size:13px}.error{color:#a22}.success{color:#175}#editor{display:none}.toolbar{display:flex;gap:8px}.toolbar button{width:auto}#notice{min-height:22px}details{border-top:1px solid #ddd;padding-top:12px}summary{cursor:pointer;font-weight:bold}#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);z-index:9999;display:flex;align-items:center;gap:12px;padding:14px 20px;max-width:calc(100vw - 32px);width:max-content;background:#fff;border:1px solid #b8e2ce;border-radius:14px;box-shadow:0 12px 34px #173b3340;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;font-size:15px;font-weight:bold;text-align:right}#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}#toast .mark{background:#16865c;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none;font-size:20px}#toast.fail{border-color:#edc6c6}#toast.fail .mark{background:#bf4545}@media(max-width:550px){#toast{top:14px;width:calc(100vw - 28px)}}@media(prefers-reduced-motion:reduce){#toast{transition:none}}</style></head><body><main><header><h1>Rosman Swimming School</h1><p class="muted">ניהול האתר • פרטים ומחירים</p></header><section id="login"><h2>כניסה לניהול</h2><form id="loginForm"><label>שם משתמש<input id="username" autocomplete="username" required></label><label>סיסמה<input id="password" type="password" autocomplete="current-password" required></label><button>כניסה</button></form></section><div id="editor"><section><div class="toolbar"><button id="logout" type="button">התנתקות</button></div><p class="muted">השינויים יפורסמו אוטומטית לאחר השמירה.</p></section><form id="editForm"><section><h2>פרטים ומחירים</h2><div class="pair"><label>שיעור פרטי (₪)<input name="privatePrice" type="number" min="0" required></label><label>שיעור זוגי (₪)<input name="pairPrice" type="number" min="0" required></label></div><label>מיקום<input name="location"></label><h2>שעות פעילות</h2><p class="muted">בחרו שעות באמצעות בורר השעות</p><p>אמצע השבוע</p><div class="pair"><label>משעה<input id="weekdayStart" type="time" step="900" required></label><label>עד שעה<input id="weekdayEnd" type="time" step="900" required></label></div><p>יום שישי</p><div class="pair"><label>משעה<input id="fridayStart" type="time" step="900" required></label><label>עד שעה<input id="fridayEnd" type="time" step="900" required></label></div></section><section><h2>שיעורי שחייה</h2><label>הטקסט המרכזי בכרטיסיית שיעורי השחייה<textarea name="lessonBody"></textarea></label></section><section><h2>ביטוחים והידרותרפיה</h2><label>הטקסט המרכזי בכרטיסיית הביטוח<textarea name="insuranceBody"></textarea></label></section><section><details><summary>פרטי קשר</summary><label>טלפון וואטסאפ (972... בלי +)<input name="whatsappPhone"></label><label>הודעה מוכנה<textarea name="whatsappMessage"></textarea></label><label>מייל<input name="contactEmail" type="email"></label></details></section><button id="save">שמירה ופרסום</button></form></div><p id="notice" role="status"></p></main><div id="toast" role="status" aria-live="polite" aria-atomic="true"><span class="mark" aria-hidden="true">✓</span><span id="toastText"></span></div><script>
const api='/\.netlify/functions/admin-api';let sha,toastTimer;const q=s=>document.querySelector(s);function notice(t,success=false){q('#notice').textContent=success?'':t;const el=q('#toast');el.classList.toggle('fail',!success);el.querySelector('.mark').textContent=success?'✓':'!';q('#toastText').textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),success?4500:6500)}
async function call(action,data){const r=await fetch(api+'?action='+action,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},credentials:'same-origin',body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw new Error([j.error,j.details].filter(Boolean).join(' — ')||'שגיאה');return j}
function parseHours(t){const m=String(t||'').match(/(\d{1,2}:\d{2})\s*[–—-]\s*(\d{1,2}:\d{2})/);return m?[m[1].padStart(5,'0'),m[2].padStart(5,'0')]:['','']}
function setHours(d){for(const k of ['weekday','friday']){const [a,b]=parseHours(d[k+'Hours']);q('#'+k+'Start').value=a;q('#'+k+'End').value=b}}
async function load(){const j=await call('read');sha=j.sha;setHours(j.data);for(const [k,v] of Object.entries(j.data)){const el=q('[name="'+k+'"]');if(el)el.value=v}q('#login').style.display='none';q('#editor').style.display='block'}
q('#loginForm').onsubmit=async e=>{e.preventDefault();try{await call('login',{username:q('#username').value,password:q('#password').value});q('#password').value='';await load();notice('מחובר בהצלחה')}catch(err){notice(err.message)}};
q('#editForm').onsubmit=async e=>{e.preventDefault();const data={};for(const el of q('#editForm').elements)if(el.name)data[el.name]=el.type==='number'?Number(el.value):el.value;for(const k of ['weekday','friday']){const a=q('#'+k+'Start').value,b=q('#'+k+'End').value;if(!a||!b||a>=b){notice('יש לבחור שעת סיום מאוחרת משעת ההתחלה');return}data[k+'Hours']=a+'–'+b}try{q('#save').disabled=true;const j=await call('save',{data,sha});sha=j.sha;notice(j.unchanged?'לא היו שינויים לשמירה':'✓ השינויים נשמרו! הפרסום באתר עשוי לקחת זמן קצר.',true)}catch(err){notice(err.message)}finally{q('#save').disabled=false}};
q('#logout').onclick=async()=>{await call('logout',{});location.reload()};
call('session').then(j=>j.authenticated?load():null).catch(()=>{});
</script></body></html>
