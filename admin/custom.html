<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ניהול האתר | Rosman Swimming School</title><meta name="description" content="כניסה לניהול אתר בית הספר לשחייה של גיל רוזמן"><meta property="og:type" content="website"><meta property="og:site_name" content="Rosman Swimming School"><meta property="og:title" content="ניהול האתר | Rosman Swimming School"><meta property="og:description" content="ממשק ניהול האתר של גיל רוזמן"><meta property="og:url" content="https://rosman-swim.netlify.app/admin/"><meta property="og:image" content="https://rosman-swim.netlify.app/admin/lucide-square-pen-compact.png"><meta property="og:image:secure_url" content="https://rosman-swim.netlify.app/admin/lucide-square-pen-compact.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="192"><meta property="og:image:height" content="192"><meta property="og:image:alt" content="ניהול האתר — Rosman Swimming School"><meta name="twitter:card" content="summary"><link rel="icon" type="image/svg+xml" href="/admin/favicon.svg"><style>
html{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{width:100%;max-width:100%;overflow-x:clip}:root{--sea:#087d86;--deep:#163f54;--mint:#e3f5f1;--line:#d8e9e9;--ink:#284653}*{box-sizing:border-box}body{background:linear-gradient(160deg,#ddf4f2 0%,#f4fbfd 48%,#eef5fa 100%);color:var(--ink);font-family:Arial,sans-serif;margin:0;min-height:100vh}main{width:100%;max-width:660px;min-width:0;margin:24px auto;padding:18px}header{text-align:center;padding:25px 15px 18px;background:linear-gradient(125deg,#0a7f8e,#155d7c);border-radius:23px;color:white;box-shadow:0 13px 30px #245f7a25;margin-bottom:24px}header h1{font-size:25px;margin:0 0 9px}header .muted{color:#e1f7f9;margin:0}h2{font-size:20px;color:#087d86;font-weight:800;letter-spacing:.1px;margin:0 0 22px;padding:9px 14px;background:linear-gradient(90deg,#e3f5f1,#f4fbfd);border-right:5px solid #12a39b;border-radius:9px}section{min-width:0;max-width:100%;background:#fff;border:1px solid #e1eded;border-radius:19px;padding:24px;margin:30px 0;box-shadow:0 7px 22px #205c7010}label{font-size:14px;font-weight:600;display:block;margin:12px 0 7px}input,textarea{min-width:0;max-width:100%;width:100%;border:1px solid #c9dfe1;border-radius:11px;background:#f8fcfd;padding:12px;font:inherit;color:#244856;direction:rtl;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus{outline:none;border-color:#0e9b94;box-shadow:0 0 0 3px #18b7aa25;background:#fff}input[type=time]{direction:ltr;text-align:center;min-width:0;color-scheme:light}textarea{min-height:140px;resize:vertical;line-height:1.65}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}.pair>label{min-width:0}.time-pair{gap:10px}.time-pair input[type=time]{display:block;width:100%;min-width:0;max-width:100%;padding:9px 5px;font-size:16px;box-sizing:border-box}button{width:100%;padding:14px;border:0;background:linear-gradient(105deg,#078c83,#0b718f);color:#fff;border-radius:12px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 5px 13px #0a8b8730}button:hover{filter:brightness(1.07)}button:disabled{opacity:.55;cursor:wait}.muted{color:#6b858c;font-size:13px;line-height:1.5}.error{color:#a22}.success{color:#175}#editor{display:none}#login{display:none}#loading{display:block;text-align:center;color:#087d86;font-weight:bold;padding:26px}.toolbar{display:flex;gap:8px;justify-content:flex-end}.toolbar button{width:auto;padding:9px 16px;background:#e7f4f4;color:#14656c;box-shadow:none}#notice{min-height:22px}details{border-top:1px solid var(--line);padding-top:14px}summary{cursor:pointer;font-weight:bold;color:#126d77}#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);z-index:9999;display:flex;align-items:center;gap:12px;padding:14px 20px;max-width:calc(100vw - 32px);width:max-content;background:#fff;border:1px solid #b8e2ce;border-radius:14px;box-shadow:0 12px 34px #173b3340;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;font-size:15px;font-weight:bold;text-align:right}#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}#toast .mark{background:#16865c;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none;font-size:20px}#toast.fail{border-color:#edc6c6}#toast.fail .mark{background:#bf4545}@media(max-width:550px){main{margin:0 auto;padding:16px}section{padding:19px;margin:24px 0}header{border-radius:16px}#toast{top:auto;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:calc(100vw - 28px);transform:translate(-50%,20px);font-size:15px;padding:16px}#toast.show{transform:translate(-50%,0)}}@media(max-width:420px){.pair{grid-template-columns:minmax(0,1fr)}.time-pair{grid-template-columns:minmax(0,1fr);gap:2px}.time-pair input[type=time]{max-width:100%;text-align:right}.time-pair>label{margin:5px 0}}@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body><main><header><h1>Rosman Swimming School</h1><p class="muted">ניהול האתר • פרטים ומחירים</p></header><section id="loading" aria-live="polite">טוען את ממשק הניהול…</section><section id="login"><h2>כניסה לניהול</h2><form id="loginForm"><label>שם משתמש<input id="username" autocomplete="username" required></label><label>סיסמה<input id="password" type="password" autocomplete="current-password" required></label><button>כניסה</button></form></section><div id="editor"><section><div class="toolbar"><button id="logout" type="button">התנתקות</button></div><p class="muted">השינויים יפורסמו אוטומטית לאחר השמירה.</p></section><form id="editForm"><section><h2>פרטים ומחירים</h2><div class="pair"><label>שיעור פרטי (₪)<input name="privatePrice" type="number" min="0" required></label><label>שיעור זוגי (₪)<input name="pairPrice" type="number" min="0" required></label></div><label>מיקום<input name="location"></label><h2>שעות פעילות</h2><p class="muted">בחרו שעות באמצעות בורר השעות</p><p>אמצע השבוע</p><div class="pair time-pair"><label>משעה<input id="weekdayStart" type="time" step="900" required></label><label>עד שעה<input id="weekdayEnd" type="time" step="900" required></label></div><p>יום שישי</p><div class="pair time-pair"><label>משעה<input id="fridayStart" type="time" step="900" required></label><label>עד שעה<input id="fridayEnd" type="time" step="900" required></label></div></section><section><h2>שיעורי שחייה</h2><label>הטקסט המרכזי בכרטיסיית שיעורי השחייה<textarea name="lessonBody"></textarea></label></section><section><h2>ביטוחים והידרותרפיה</h2><label>הטקסט המרכזי בכרטיסיית הביטוח<textarea name="insuranceBody"></textarea></label></section><section><details><summary>פרטי קשר</summary><label>טלפון וואטסאפ (972... בלי +)<input name="whatsappPhone"></label><label>הודעה מוכנה<textarea name="whatsappMessage"></textarea></label><label>מייל<input name="contactEmail" type="email"></label></details></section><button id="save">שמירה ופרסום</button></form></div><p id="notice" role="status"></p></main><div id="toast" role="status" aria-live="polite" aria-atomic="true"><span class="mark" aria-hidden="true">✓</span><span id="toastText"></span></div><script>
const api='/\.netlify/functions/admin-api';let sha,toastTimer;const q=s=>document.querySelector(s);function notice(t,success=false){q('#notice').textContent=success?'':t;const el=q('#toast');el.classList.toggle('fail',!success);el.querySelector('.mark').textContent=success?'✓':'!';q('#toastText').textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),success?6500:7000)}
async function call(action,data){const r=await fetch(api+'?action='+action,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},credentials:'same-origin',body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw new Error([j.error,j.details].filter(Boolean).join(' — ')||'שגיאה');return j}
function parseHours(t){const m=String(t||'').match(/(\d{1,2}:\d{2})\s*[–—-]\s*(\d{1,2}:\d{2})/);return m?[m[1].padStart(5,'0'),m[2].padStart(5,'0')]:['','']}
function setHours(d){for(const k of ['weekday','friday']){const [a,b]=parseHours(d[k+'Hours']);q('#'+k+'Start').value=a;q('#'+k+'End').value=b}}
async function load(){const j=await call('read');sha=j.sha;setHours(j.data);for(const [k,v] of Object.entries(j.data)){const el=q('[name="'+k+'"]');if(el)el.value=v}q('#loading').style.display='none';q('#login').style.display='none';q('#editor').style.display='block';lastRenew=Date.now();resetIdle()}
q('#loginForm').onsubmit=async e=>{e.preventDefault();try{await call('login',{username:q('#username').value,password:q('#password').value});q('#password').value='';await load();notice('התחברת בהצלחה!',true)}catch(err){notice(err.message)}};
q('#editForm').onsubmit=async e=>{e.preventDefault();const data={};for(const el of q('#editForm').elements)if(el.name)data[el.name]=el.type==='number'?Number(el.value):el.value;for(const k of ['weekday','friday']){const a=q('#'+k+'Start').value,b=q('#'+k+'End').value;if(!a||!b||a>=b){notice('יש לבחור שעת סיום מאוחרת משעת ההתחלה');return}data[k+'Hours']=a+'–'+b}try{q('#save').disabled=true;const j=await call('save',{data,sha});sha=j.sha;notice(j.unchanged?'לא היו שינויים לשמירה':'✓ השינויים נשמרו! הפרסום באתר עשוי לקחת זמן קצר.',true)}catch(err){notice(err.message)}finally{q('#save').disabled=false}};
// Refresh only after meaningful activity, at most once every ten minutes.
let lastRenew=Date.now(),lastActivity=Date.now(),idleTimer,renewing=false;
function activeSession(){return q('#editor').style.display==='block'}
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(activeSession()){q('#editor').style.display='none';q('#login').style.display='block';notice('עברו 30 דקות ללא פעילות. יש להתחבר מחדש.')}},30*60*1000)}
function activity(){if(!activeSession())return;lastActivity=Date.now();resetIdle();if(!renewing&&Date.now()-lastRenew>=10*60*1000){renewing=true;call('refresh',{}).then(()=>{lastRenew=Date.now()}).catch(()=>{q('#editor').style.display='none';q('#login').style.display='block';notice('פג תוקף ההתחברות. יש להתחבר מחדש.')}).finally(()=>{renewing=false})}}
for(const name of ['pointerdown','keydown','input'])document.addEventListener(name,activity,{passive:true});
q('#logout').onclick=async()=>{await call('logout',{});location.reload()};
call('session').then(async j=>{if(j.authenticated){try{await load()}catch(err){q('#loading').style.display='none';q('#login').style.display='block';notice('לא ניתן לטעון את הנתונים. נסו להתחבר מחדש')}}else{q('#loading').style.display='none';q('#login').style.display='block'}}).catch(()=>{q('#loading').style.display='none';q('#login').style.display='block';notice('לא ניתן לבדוק התחברות. נסו שוב')});
</script></body></html>
