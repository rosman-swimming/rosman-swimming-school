<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>יצירת פרטי התחברות מאובטחים</title><style>body{max-width:620px;margin:40px auto;padding:20px;font:16px Arial;line-height:1.6}input,button,textarea{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:8px 0}textarea{direction:ltr;min-height:80px}button{background:#176c61;color:white;border:0;border-radius:9px}label{display:block;font-weight:bold}p{color:#566}</style><h1>הגדרת כניסה לממשק הניהול</h1><p>החישוב מתבצע בדפדפן שלך בלבד. הסיסמה אינה נשלחת לשום שירות. שמרי אותה במנהל הסיסמאות שלך.</p><label>שם משתמש<input id="username" autocomplete="off" value="gilrosman"></label><label>סיסמה חדשה וחזקה (16 תווים לפחות)<input id="password" type="password" autocomplete="new-password"></label><button id="generate">הפקת הגדרות מאובטחות</button><p id="status"></p><section hidden id="output"><label>ADMIN_USERNAME<textarea id="u" readonly></textarea></label><label>ADMIN_PASSWORD_HASH<textarea id="h" readonly></textarea></label><label>SESSION_SECRET<textarea id="s" readonly></textarea></label><p>הדביקי כל ערך בהגדרות Environment variables של Netlify. לעולם אל תשמרי את הערכים ב־GitHub.</p></section><script>
const el=id=>document.getElementById(id),hex=a=>Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
el('generate').onclick=async()=>{const pass=el('password').value;if(pass.length<16||el('username').value.length<3){el('status').textContent='נא להזין שם משתמש וסיסמה באורך 16 תווים לפחות';return}
el('generate').disabled=true;el('status').textContent='מחשב הגדרות...';try{const salt=crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},key,256);el('u').value=el('username').value;el('h').value=hex(salt)+':'+hex(new Uint8Array(bits));el('s').value=hex(crypto.getRandomValues(new Uint8Array(32)));el('output').hidden=false;el('password').value='';el('status').textContent='ההגדרות מוכנות';}catch{el('status').textContent='לא ניתן להפיק הגדרות בדפדפן הזה'}finally{el('generate').disabled=false}};
</script>
