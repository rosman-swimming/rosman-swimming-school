name: Validate website
on:
  push:
    branches: [cms-setup, custom-admin, main]
    paths-ignore:
      - 'content/site.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'content/site.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source assets
        run: |
          test -s flyer.jpg
          test -s og.jpg
          test -s content/site.json
      - name: Build site
        run: node build.js
      - name: Run admin security unit tests
        run: node --test tests/admin.test.js
      - name: Verify generated files
        run: |
          test -s dist/index.html
          test -s dist/flyer.jpg
          test -s dist/og.jpg
          test -s dist/admin/index.html
          ! test -e dist/admin/config.yml
          node -e "const d=require('./content/site.json');const h=require('fs').readFileSync('dist/index.html','utf8');for(const p of [d.privatePrice,d.pairPrice])if(!h.includes(String(p)+' ₪'))process.exit(1)"
          grep -q 'Rosman Swimming School' dist/index.html
